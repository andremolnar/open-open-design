packages:
  - packages/*
  - apps/*
  - tools/*
  - shells/*
  - e2e

# Single source for dependency overrides/build policy (not duplicated in package.json).
# Security selections and cross-major compatibility notes:
# docs/motion-dependency-remediation-2026-10-21.md
overrides:
  '@hono/node-server@^1': 1.19.17
  '@opentelemetry/core@^2': 2.12.0
  '@xmldom/xmldom@^0.8': 0.8.15
  '@xmldom/xmldom@^0.9': 0.9.12
  adm-zip: 0.6.1
  baseline-browser-mapping: 2.11.30
  body-parser: 2.3.0
  brace-expansion: 5.0.12
  builder-util-runtime: 9.7.0
  devalue: 5.8.1
  dompurify: 3.4.17
  esbuild: 0.28.2
  fast-uri: 3.1.9
  'fflate@^0.4': 0.4.9
  form-data: 4.0.6
  # v4 keeps the bootstrap API and drops roarr/sprintf-js.
  'global-agent@^3': 4.1.3
  hono: 4.13.13
  http-cache-semantics: 4.3.0
  ip-address: 10.7.4
  js-yaml: 4.3.2
  katex: 0.19.0
  lodash-es: 4.18.1
  mermaid: 11.17.2
  'nanoid@^3': 3.3.20
  'nanoid@^4': 5.1.16
  node-abi: 4.38.0
  postcss: 8.5.31
  # PptxGenJS 4.0.1's published runtime does not import this obsolete dependency.
  'pptxgenjs>image-size': '-'
  protobufjs: 8.8.1
  proxy-addr: 2.0.8
  qs: 6.16.1
  # Excalidraw pins an obsolete Sass with a second Chokidar 3/braces chain.
  sass: 1.106.0
  sharp: 0.35.5
  source-map-js: 1.2.2
  tar: 7.5.22
  tmp: 0.2.7
  'undici@^6': 6.29.1
  'undici@^7': 7.30.1
  'vite@^7': 7.3.7
  yaml: 2.9.0

onlyBuiltDependencies:
  - better-sqlite3
  - core-js
  - electron
  - electron-winstaller
  - esbuild
  - onnxruntime-node
  - protobufjs
  - sharp
